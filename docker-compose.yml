version: "3.9"

# NOTE: There is no database service in this file on purpose. Postgres is
# hosted separately on your VM. Set DATABASE_URL in .env (root) to point at
# it, e.g. postgres://pulse_user:password@VM_IP:5432/pulse_fitness

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pulse-backend:latest
    container_name: pulse-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 4000
    ports:
      - "4000:4000"
    networks:
      - pulse-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_API_KEY: ${VITE_API_KEY:-}
    image: pulse-frontend:latest
    container_name: pulse-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - pulse-net

networks:
  pulse-net:
    driver: bridge
